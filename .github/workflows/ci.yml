name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            gen/go/go.sum
            services/catalog-service/go.sum
            services/pricing-service/go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l gen/go services/catalog-service services/pricing-service)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify module downloads
        run: |
          for module in gen/go services/catalog-service services/pricing-service; do
            echo "==> go mod verify ($module)"
            (cd "$module" && go mod verify)
          done

      - name: Run tests
        run: |
          for module in gen/go services/catalog-service services/pricing-service; do
            echo "==> go test ($module)"
            (cd "$module" && go test ./...)
          done

      - name: Run go vet
        run: |
          for module in services/catalog-service services/pricing-service; do
            echo "==> go vet ($module)"
            (cd "$module" && go vet ./...)
          done

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for module in services/catalog-service services/pricing-service; do
            echo "==> govulncheck ($module)"
            (cd "$module" && govulncheck ./...)
          done

      - name: Build Go commands
        run: |
          for module in services/catalog-service services/pricing-service; do
            echo "==> go build ($module)"
            (cd "$module" && go build ./cmd/...)
          done

      - name: Build catalog-service image
        run: docker build -f services/catalog-service/Dockerfile -t grpc-duo/catalog-service:ci .

      - name: Build pricing-service image
        run: docker build -f services/pricing-service/Dockerfile -t grpc-duo/pricing-service:ci .
