services:
  postgres:
    image: postgres:17-alpine
    container_name: grpc-duo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grpc_duo}
      POSTGRES_USER: ${POSTGRES_USER:-grpc_duo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grpc_duo_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/pricing-service:/docker-entrypoint-initdb.d:ro
    networks:
      - grpc-duo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    image: grpc-duo/pricing-service:local
    container_name: grpc-duo-pricing-service
    init: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRICING_GRPC_ADDR: :9090
      PRICING_DATABASE_URL: postgres://${POSTGRES_USER:-grpc_duo_app}:${POSTGRES_PASSWORD:-grpc_duo_dev_password}@postgres:5432/${POSTGRES_DB:-grpc_duo}?sslmode=disable
      PRICING_DATABASE_CONNECT_TIMEOUT: ${PRICING_DATABASE_CONNECT_TIMEOUT:-5s}
      PRICING_DATABASE_QUERY_TIMEOUT: ${PRICING_DATABASE_QUERY_TIMEOUT:-2s}
      PRICING_DATABASE_MAX_OPEN_CONNS: ${PRICING_DATABASE_MAX_OPEN_CONNS:-5}
      PRICING_DATABASE_MAX_IDLE_CONNS: ${PRICING_DATABASE_MAX_IDLE_CONNS:-5}
      PRICING_DATABASE_CONN_MAX_LIFETIME: ${PRICING_DATABASE_CONN_MAX_LIFETIME:-30m}
      PRICING_READINESS_CHECK_INTERVAL: ${PRICING_READINESS_CHECK_INTERVAL:-10s}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - grpc-duo
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/grpc-healthcheck", "127.0.0.1:9090"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: grpc-duo/catalog-service:local
    container_name: grpc-duo-catalog-service
    init: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CATALOG_HTTP_ADDR: :8080
      CATALOG_READ_TIMEOUT: ${CATALOG_READ_TIMEOUT:-5s}
      CATALOG_WRITE_TIMEOUT: ${CATALOG_WRITE_TIMEOUT:-10s}
      CATALOG_IDLE_TIMEOUT: ${CATALOG_IDLE_TIMEOUT:-60s}
      CATALOG_MAX_HEADER_BYTES: ${CATALOG_MAX_HEADER_BYTES:-1048576}
      CATALOG_PRICING_GRPC_ADDR: pricing-service:9090
      CATALOG_PRICING_GRPC_DEADLINE: ${CATALOG_PRICING_GRPC_DEADLINE:-2s}
    depends_on:
      pricing-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - grpc-duo
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/http-healthcheck", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  grpc-duo:
    driver: bridge

volumes:
  postgres-data:
